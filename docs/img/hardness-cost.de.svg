><text x="289.3" y="291.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">−0,1 %</text><text x="24.0" y="354.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">FurMark 2, 60 s, jeweils gegen den Standard-Lauf desselben Tages.</text><text x="24.0" y="372.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">Effizienz zahlt stattdessen in Strom: 215 W ohne, 237 W mit Härtetest (Standard ~252 W).</text><text x="24.0" y="390.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">Das ungetestete Ausgewogen vom 10.10. ist beim Spielen mit Stream abgestürzt.</text></svg>