<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img"><title>Was der Härtetest an Leistung kostet</title><desc>Max. Leistung: +3,9 % → +2,9 %; Schnell: +3,7 % → +1,9 %; Ausgewogen: +3,0 % → +0,9 %; Effizienz: −0,7 % → −0,1 %</desc><rect x="0.5" y="0.5" width="759" height="411" rx="12" fill="#ffffff" stroke="#e1e0d9"/><text x="24.0" y="34.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Was der Härtetest an Leistung kostet</text><text x="24.0" y="56.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Dieselbe Karte: 1–2 % weniger auf dem Papier — dafür halten die Profile auch Spielen mit Aufnahme aus.</text><rect x="200" y="74" width="10" height="10" rx="2" fill="#a8a69e"/><text x="216.0" y="84.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">ohne Härtetest (09./10.10.)</text><rect x="450" y="74" width="10" height="10" rx="2" fill="#2a78d6"/><text x="466.0" y="84.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">mit allen Endtests (23./24.10.)</text><line x1="200.0" y1="102" x2="200.0" y2="314" stroke="#e1e0d9" stroke-width="1"/><text x="200.0" y="330.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">−1 %</text><line x1="283.3" y1="102" x2="283.3" y2="314" stroke="#c3c2b7" stroke-width="1"/><text x="283.3" y="330.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">0</text><line x1="366.7" y1="102" x2="366.7" y2="314" stroke="#e1e0d9" stroke-width="1"/><text x="366.7" y="330.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">+1 %</text><line x1="450.0" y1="102" x2="450.0" y2="314" stroke="#e1e0d9" stroke-width="1"/><text x="450.0" y="330.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">+2 %</text><line x1="533.3" y1="102" x2="533.3" y2="314" stroke="#e1e0d9" stroke-width="1"/><text x="533.3" y="330.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">+3 %</text><line x1="616.7" y1="102" x2="616.7" y2="314" stroke="#e1e0d9" stroke-width="1"/><text x="616.7" y="330.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">+4 %</text><line x1="700.0" y1="102" x2="700.0" y2="314" stroke="#e1e0d9" stroke-width="1"/><text x="700.0" y="330.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">+5 %</text><text x="24.0" y="130.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="400">Max. Leistung</text><path d="M283.3,112.0 H604.3 Q608.3,112.0 608.3,116.0 V122.0 Q608.3,126.0 604.3,126.0 H283.3 Z" fill="#a8a69e"/><text x="614.3" y="123.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">+3,9 %</text><path d="M283.3,130.0 H521.0 Q525.0,130.0 525.0,134.0 V140.0 Q525.0,144.0 521.0,144.0 H283.3 Z" fill="#2a78d6"/><text x="531.0" y="141.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">+2,9 %</text><text x="24.0" y="180.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"