<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" role="img"><title>Eine RTX 4080, alle Profile mit bestandenem Härtetest — 3DMark gegen Standard</title><desc>Effizienz: Speed Way +2,4 %, Time Spy +1,8 %, 314 W; Ausgewogen: Speed Way +2,0 %, Time Spy +1,7 %, 313 W; Max. Leistung: Speed Way +2,5 %, Time Spy +2,0 %, 315 W; Schnell (95 % Power-Limit): Speed Way +1,3 %, Time Spy +1,3 %, 299 W</desc><rect x="0.5" y="0.5" width="759" height="393" rx="12" fill="#ffffff" stroke="#e1e0d9"/><text x="24.0" y="34.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Eine RTX 4080, alle Profile mit bestandenem Härtetest — 3DMark gegen Standard</text><text x="24.0" y="56.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Unter Volllast hängt die Karte am Power-Limit: die Kurve holt ~2 % mehr, ein niedrigeres Limit spart Strom.</text><text x="24.0" y="84.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="400">Profil</text><text x="710.0" y="84.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#898781" text-anchor="end" font-weight="400">Watt (Speed Way)</text><rect x="230" y="74" width="10" height="10" rx="2" fill="#2a78d6"/><text x="246.0" y="84.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Speed Way</text><rect x="330" y="74" width="10" height="10" rx="2" fill="#eb6834"/><text x="346.0" y="84.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Time Spy (Grafik)</text><line x1="230.0" y1="102" x2="230.0" y2="314" stroke="#c3c2b7" stroke-width="1"/><text x="230.0" y="330.0"